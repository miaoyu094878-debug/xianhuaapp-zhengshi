[build]
  publish = "."
  command = ""

# ── PWA / Service Worker 正确缓存 ──
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# SPA 兜底（当前为单页隐藏 section，可不依赖，但保留安全）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
